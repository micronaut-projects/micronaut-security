plugins {
    id "io.micronaut.build.internal.security-tests"
    id "io.micronaut.build.internal.python"
}

dependencies {
    // Annotation processors MUST be testImplementation (not testAnnotationProcessor): the Python compiler
    // compiler takes the compile classpath as its annotation processor path.
    testImplementation(projects.micronautSecurityProcessor)
    testImplementation(mnSerde.micronaut.serde.processor)
    testImplementation(mnData.micronaut.data.processor)
    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mn.micronaut.context.python)
    testCompileOnly(mn.jackson.databind)

    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnLogging.logback.classic)

    testImplementation(mn.micronaut.management)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.websocket)
    testImplementation(projects.micronautSecurityJwt)
    testImplementation(projects.micronautSecurityOauth2)
    testImplementation(projects.testSuiteUtilsSecurity)
    testImplementation(projects.testSuiteKeycloakDocker)
    testImplementation(platform(mnTest.boms.testcontainers))
    testImplementation(libs.testcontainers)
    testImplementation(mnReactor.micronaut.reactor)
    testImplementation(mnSerde.micronaut.serde.jackson)

    testImplementation(mnData.micronaut.data.jdbc)
    testImplementation(mnSql.h2)
    testImplementation(mnSql.micronaut.jdbc.hikari)
    testImplementation(libs.bcpkix)
}

tasks.withType(Test).configureEach {
    systemProperty "micronaut.python.pool.enabled", "false"
}

tasks.named('test') {
    useJUnitPlatform()
}
