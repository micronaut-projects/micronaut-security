plugins {
    id "io.micronaut.build.internal.security-base"
    id "io.micronaut.build.internal.module"
}
tasks.named("jacocoTestCoverageVerification") {
    dependsOn(tasks.named("test"))
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        // generated by the Micronaut build plugins
        exclude("io/micronaut/security/info/**")
    })
    violationRules {
        rule {
            limit {
                counter = "LINE"
                minimum = 0.3
            }
            limit {
                counter = "BRANCH"
                minimum = 0.2
            }
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("jacocoTestCoverageVerification"))
}

// The Micronaut build plugins only enable JaCoCo on CI, and they do so in afterEvaluate.
// Registered after them, so that the coverage verification also has data locally.
afterEvaluate {
    tasks.withType(Test).configureEach {
        jacoco.enabled = true
    }
}
dependencies {
    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(mnTest.junit.jupiter.params)
    testImplementation(mnTest.junit.platform.suite)
    testImplementation(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testImplementation(mnLogging.logback.classic)
}

tasks.named('test') {
    useJUnitPlatform()
}

