// Requires the tests of a module to cover every line and branch of its main classes.
// JaCoCo collects data on CI; the verification is skipped when there is no data. To verify locally, run
// check with -Pmicronaut.jacoco.enabled=true -DpredictiveTestSelection=false so that every test runs.
plugins {
    id "io.micronaut.build.internal.security-module"
}

tasks.named("jacocoTestCoverageVerification") {
    dependsOn(tasks.named("test"))
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        // generated by the Micronaut build plugins
        exclude("io/micronaut/security/info/**")
    })
    violationRules {
        rule {
            limit {
                counter = "LINE"
                minimum = 1.0
            }
            limit {
                counter = "BRANCH"
                minimum = 1.0
            }
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("jacocoTestCoverageVerification"))
}
